# これは価値観インタビューの回答を保存するファイルの雛形です。
# 実データは `autox profile interview` を実行すると自動的に
# config/profile.yaml (このファイルとは別。.gitignore対象)に保存されます。
# 手で埋めたい場合は、このファイルを config/profile.yaml としてコピーし、
# 各キーの右側に回答を書いてください(質問文は autox/profile/questions.py 参照)。
#
#   cp config/profile.example.yaml config/profile.yaml
#
# 空欄のキーは「未回答」として扱われ、生成AIには一般的なトーンで補うよう指示されます。
# 末尾に (任意) と書いてあるキーは、埋めなくても中核プロフィールとしては完成扱いです。

